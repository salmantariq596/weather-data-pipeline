version: 2

models:
  - name: stg_weather_current_clean
    columns:
      - name: id
        tests:
          - unique
          - not_null
      - name: temperature
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: -90
              max_value: 60
      - name: humidity_percent
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
      - name: data_quality_score
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1

  - name: daily_weather_summary
    columns:
      - name: date
        tests:
          - unique
          - not_null
      - name: avg_temperature
        tests:
          - not_null
